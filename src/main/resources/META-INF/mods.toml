displayURL="https://www.curseforge.com/minecraft/mc-mods/auto-window-size"
issueTrackerURL="https://github.com/3270728922/AutoWindowSize/issues"
description='''
Auto Window Size is a lightweight, client-side utility that
automatically sizes, centers and locks the Minecraft game
window, so carefully tuned modpack UI layouts stay consistent
on every player's PC.

WHY IT EXISTS
When building a modpack you spend a lot of time arranging GUIs,
HUDs and interactive screens exactly right. But the moment a player
launches the game on a different monitor or resolution, the window
resizes and every layout breaks. This mod takes control of that
one variable: it turns "game window size" from a lucky accident
into a deliberate, repeatable, constrained choice.

It is intentionally minimal in scope. It only touches the OS-level
window itself. It does not change GUI scale, does not touch any
in-game rendering or gameplay logic, and therefore almost never
conflicts with other mods.

HOW IT WORKS
On launch it waits about 1.5 seconds (30 ticks) so the loading
screen never gets stretched, then resizes the window to your
configured resolution and centers it on the monitor the window is
actually sitting on. When the size lock is enabled the window can
be made larger freely, but can never be shrunk below the configured
size, keeping every tuned UI from being dragged out of place.

FEATURES
- Auto window sizing on launch, with a 1.5s delay to avoid
  stretching the loading screen.
- Minimum size lock: grow as big as you like, never shrink below
  the configured resolution.
- A native "Window Settings" button injected right below the
  Fullscreen Resolution row in Video Settings.
- A dedicated Window Settings screen showing live screen resolution
  and current window resolution (turns yellow and labeled when
  fullscreen).
- A "Center Window" button that centers the window on its current
  monitor in one click; it is automatically disabled, with a reason
  shown, while fullscreen, maximized, minimized, or already centered.
- Client commands under /aws: toggle, lock, unlock, status, gui,
  and center.
- Fullscreen support: the lock is suspended in fullscreen and
  restored to its previous state when you leave.
- Multi-monitor aware: centering follows whichever monitor the
  window is currently on.
- An optional hotkey to open the Window Settings screen (unbound
  by default so it never fights your existing keybinds).
- A short chat status message every time you enter a world.
- Graceful fallback: if the configured resolution is larger than
  your screen, the lock is silently disabled and explained in chat
  instead of crashing.

STATUS AND FUTURE PLANS
This is the author's first Minecraft mod. It is currently maintained
and tested only on Minecraft 1.20.1 with Forge. The priority right
now is stability, polish and documentation rather than rushing out
more versions. Once this release is proven stable, ports to other
versions or loaders (such as NeoForge or Fabric) may follow.

DETAILS
- Client-side only; no server install required.
- Config file: config/autowindowsize-client.toml, with bilingual
  (English above, Chinese below) comments.
- Default resolution 1280x720; the lower bound is bound to the
  hardcoded minimum of 856x482 (16:9), so you can never configure a
  window smaller than the mod actually supports.
- Does not work on mobile / Bedrock editions; desktop Java edition
  only (Windows / macOS / Linux).

LINKS
GitHub:        https://github.com/3270728922/AutoWindowSize
CurseForge:    https://www.curseforge.com/minecraft/mc-mods/auto-window-size
Modrinth:      https://modrinth.com/mod/autowindowsize
MC百科:        https://www.mcmod.cn/class/30769.html
BBSMC:         https://bbsmc.net/mod/autowindowsize
'''

