modId="autowindowsize"
version="${mod_version}"
displayName="Auto Window Size"
authors="JujuMLQwQ"
credits="AI assisted generation"
logoFile="logo.png"
logoBlur=false
description='''
Auto resize Minecraft game window with configurable size.

Features:
- Auto set window size and center on startup
- Lock minimum window size, can enlarge but not shrink
- Window settings button in video settings screen (native list entry)
- Config resolution >= screen resolution: lock disabled, window size unchanged
- Restore config window size when exiting fullscreen
- Multi-monitor support (detects current monitor)
- Customizable hotkey to toggle lock (default unbound)
- Lock status chat message on entering world
- Config values auto-clamped, no crash

Config: config/autowindowsize-client.toml

This is the author's first mod, generated with AI assistance.
Feedback and suggestions are welcome.
'''
