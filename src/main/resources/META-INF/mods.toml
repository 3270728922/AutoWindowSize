description='''
Auto Window Size is a lightweight, client-side utility that
automatically sizes, centers and locks the Minecraft game
window, so carefully tuned modpack UI layouts stay consistent
on every player's PC.

WHY IT EXISTS
When building a modpack you spend a lot of time arranging GUIs,
HUDs and interactive screens exactly right. But the moment a player
launches the game on a different monitor or resolution, the window
resizes and every layout breaks. This mod takes control of that
one variable: it turns "game window size" from a lucky accident
into a deliberate, repeatable, constrained choice.

It is intentionally minimal in scope. It only touches the OS-level
window itself. It does not change GUI scale, does not touch any
in-game rendering or gameplay logic, and therefore almost never
conflicts with other mods.

HOW IT WORKS
On launch it waits a configurable delay (default 1.5 seconds, 30
ticks) so the loading screen never gets stretched, then resizes the
window to your configured resolution and centers it on the monitor
the window is actually sitting on. When the minimum size lock is
enabled the window can be made larger freely, but can never be
shrunk below the configured size, keeping every tuned UI from being
dragged out of place.

FEATURES
- Auto window sizing on launch, with a configurable delay
  (default 1.5s) to avoid stretching the loading screen.
- Resolution presets: common resolutions grouped by aspect ratio
  (16:9, 16:10, 4:3, 5:4, 21:9) with 12 presets each, plus a
  custom width/height input with live boundary validation. Presets
  larger than the current screen or matching the current size are
  auto-disabled.
- Minimum size lock: grow as big as you like, never shrink below
  the configured resolution.
- Fixed window size: freeze the window at its current size (min =
  max = size at toggle time). No jump to the config value, no forced
  recenter, no resizing at all. The title-bar maximize button is
  disabled at the OS level (GLFW_RESIZABLE=false, which removes
  WS_MAXIMIZEBOX on Windows), so a "fake maximized" state is
  impossible; the fixed-window-size toggle itself is disabled while
  the window is maximized or fullscreen. Fullscreen still works and
  returns to the fixed size on exit.
- Center window: one-click centering on whichever monitor the
  window is currently on; disabled with a reason while fullscreen,
  maximized, minimized or already centered.
- Auto fullscreen / maximize on launch: persistent player toggles
  plus a one-time onboarding flag for modpack authors.
- Window position memory: optionally save and restore the window
  position and size across launches instead of forcing center;
  compatible with auto-fullscreen / auto-maximize.
- A native "Window Settings" button in Options → Accessibility
  Settings (moved from Video Settings to stay compatible with mods
  like Embeddium that replace the video settings screen).
- A dedicated Window Settings screen with a four-line live info area
  (screen resolution / window state + config status / detailed status
  / input bounds), toggles for all features, resolution presets,
  custom resolution input, and button hover tooltips.
- Client commands under /aws: help, gui, status, toggle, lock,
  unlock, fixed, center, fullscreen, maximize, remember, resolution.
- Fullscreen support: the minimum size lock and fixed window size
  are suspended in fullscreen and restored to their previous state
  when you leave.
- Multi-monitor aware: centering follows whichever monitor the
  window is currently on.
- An optional hotkey to open the Window Settings screen (unbound
  by default).
- A short chat status message every time you enter a world.
- Live resolution readout: updates 0.2s after you stop dragging.
- Graceful fallback: if the configured resolution is larger than
  your screen, only the minimum size lock is disabled; fixed window
  size and centering keep working.
- Config screen translations: config option names and descriptions
  follow the game language when opened via a config-screen mod.

STATUS AND FUTURE PLANS
This is the author's first Minecraft mod. It is currently maintained
and tested only on Minecraft 1.20.1 with Forge. The priority right
now is stability, polish and documentation. Multi-version ports
(1.20.2–1.20.6) are planned for a future release.

DETAILS
- Client-side only; no server install required.
- Config files: config/AutoWindowSize/config.toml (main config)
  and config/AutoWindowSize/window.json (saved window position).
- Default resolution 1280x720; hardcoded minimum 856x482 (16:9).
- Does not work on mobile / Bedrock editions; desktop Java edition
  only (Windows / macOS / Linux).
- Supports 20 languages: English, Simplified Chinese, Traditional
  Chinese, Japanese, Korean, Russian, French, German, Spanish,
  Portuguese (BR), Italian, Turkish, Dutch, Polish, Vietnamese,
  Arabic, Thai, Swedish, Czech, Indonesian.

LINKS
Prefer GitHub Releases for the always-latest build; other platforms may
lag behind by a few days due to review or sync delays.
GitHub:          https://github.com/3270728922/AutoWindowSize
GitHub Releases: https://github.com/3270728922/AutoWindowSize/releases
CurseForge:      https://www.curseforge.com/minecraft/mc-mods/auto-window-size
Modrinth:        https://modrinth.com/mod/autowindowsize
MC百科:          https://www.mcmod.cn/class/30769.html
MCBBS:           https://www.mcbbs.co/thread-6322-1-1.html
