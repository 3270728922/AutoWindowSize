displayURL="https://www.curseforge.com/minecraft/mc-mods/auto-window-size"
issueTrackerURL="https://github.com/3270728922/AutoWindowSize/issues"
description='''
Auto Window Size automatically sizes, centers and locks the game
window so modpack UI layouts stay consistent on every PC.

Why it exists
When building a modpack, UI layouts are tuned carefully, but a
player launching at a different resolution can resize the window
and break them. This mod turns window size from a lucky accident
into something controlled and repeatable. It is intentionally
lightweight: it only touches the window itself, changes no gameplay
or rendering, and should not conflict with other mods.

How it works
On launch it sets the window to your configured resolution and
centers it on the monitor the window is actually on. A 1.5 second
delay avoids stretching the loading screen. When the lock is on,
the window can be enlarged freely but never shrinks below your
chosen size.

Features
- Auto window size and centering on launch
- Minimum size lock: grow freely, never shrink below config
- Native Window Settings button in Video Settings
- Dedicated screen with live screen/window resolution
- /aws commands: toggle, lock, unlock, status, gui
- Lock suspends in fullscreen, restored on exit
- Multi-monitor aware centering
- Optional hotkey (unbound by default)
- Chat status message on entering a world
- Graceful fallback if the display is too small

Status and future plans
This is the author's first mod. For now it targets only
Minecraft 1.20.1 on Forge, with the focus on stability and polish.
Once it is proven stable, ports to other versions or loaders such
as NeoForge or Fabric may follow.

Details
- Client-side only, no server install required
- Config: config/autowindowsize-client.toml (bilingual comments)
- Default 1280x720, range bound to hard minimum 856x482

Links
https://github.com/3270728922/AutoWindowSize
https://www.curseforge.com/minecraft/mc-mods/auto-window-size
https://modrinth.com/mod/autowindowsize
https://www.mcmod.cn/class/30769.html
https://bbsmc.net/mod/autowindowsize
'''

