description='''
Auto Window Size is a lightweight, client-side utility that
automatically resizes, centers and locks the Minecraft game
window, so carefully tuned modpack UI layouts stay consistent
on every player's PC.

PURPOSE
When building a modpack you spend a lot of time arranging GUIs,
HUDs and interactive screens exactly right. But the moment a
player launches the game on a different monitor or resolution,
the window resizes and every layout breaks. This mod takes
control of that one variable: it turns "game window size" from
a random event into a controllable, repeatable, constrained
choice. It is intentionally minimal in scope. It only touches
the OS-level window itself. It does not change GUI scaling,
does not touch any in-game rendering or gameplay logic, and
therefore almost never conflicts with other mods.

FEATURES
- Auto window sizing on launch, with configurable delay
  (default 1.5s) to avoid stretching the loading screen.
- Resolution presets grouped by aspect ratio (16:9, 16:10,
  4:3, 5:4, 21:9) with 12 presets each, plus custom width/
  height input with live boundary validation. Presets larger
  than the current screen or matching the current size are
  auto-disabled.
- Minimum size lock: grow as big as you like, never shrink
  below the configured resolution.
- Fixed window size: freeze the window at its current size.
  The title-bar maximize button is disabled at the OS level,
  so a "fake maximized" state is impossible.
- Center window: one-click centering on whichever monitor the
  window is currently on; disabled with a reason while
  fullscreen, maximized, minimized or already centered.
- Auto fullscreen / maximize / borderless on launch:
  persistent player toggles plus a one-time onboarding flag
  for modpack authors.
- Window position memory: optionally save and restore the
  window position and size across launches instead of forcing
  center; compatible with auto-fullscreen / auto-maximize.
- Always on top: normal mode and forced mode (forced mode
  re-claims top focus every frame).
- Borderless window mode, including pseudo-fullscreen (alt-tab
  does not minimize the game).
- Window state cycle button: windowed -> maximized ->
  fullscreen, works in borderless mode too.
- Keybindings for center window, switch to windowed, cycle
  window state, and toggle always on top (unbound by default),
  plus a key to open the settings screen.
- Client commands under /aws: help, gui, status, toggle,
  lock, unlock, fixed, center, fullscreen, maximize,
  remember, top, debug, borderless, resolution.
- Fullscreen support: minimum size lock and fixed window size
  are suspended in fullscreen and restored when you leave.
- Multi-monitor aware: centering follows whichever monitor the
  window is currently on.
- Live resolution readout on the settings screen.
- Graceful fallback: if the configured resolution is larger
  than your screen, only the minimum size lock is disabled;
  fixed window size and centering keep working.
- Config screen translations: option names and descriptions
  follow the game language when opened via a config-screen mod.
- Supports 20 languages.

USAGE
1. Install the mod, launch the game, click "Window Settings"
   in Accessibility Settings (or use /aws gui).
2. Adjust settings in the config screen.
3. Cycle aspect ratios and select presets to resize and center
   in one click.
4. Bind keys in Controls Settings for quick actions.
5. Type /aws help to see all available commands.

DETAILS
- Client-side only; no server install required.
- Config files: config/AutoWindowSize/config.toml (main
  config) and config/AutoWindowSize/window.json (saved
  window position).
- Default resolution 1280x720; hardcoded minimum 856x482;
  maximum 7680x4320.
- Desktop Java Edition only (Windows / macOS / Linux). Not
  supported on mobile / Bedrock Edition.

DOWNLOAD
Prefer GitHub for the always-latest build; other platforms may
lag behind by a few days due to review or sync delays.
