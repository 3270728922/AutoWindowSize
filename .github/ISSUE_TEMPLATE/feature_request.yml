name: "功能建议"
description: "建议新功能或改进现有功能"
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议！请描述清楚你的使用场景和期望。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: "你在什么情况下需要这个功能？当前是怎么解决的？"
      placeholder: "例如：做整合包时需要让窗口自动在第二台显示器居中…"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么实现
      description: "你期望这个功能怎么工作？"
      placeholder: "例如：在设置界面加一个下拉框选择显示器…"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案（可选）
      description: "你还考虑过哪些方案？为什么不选？"
#（注：内容由AI生成）
